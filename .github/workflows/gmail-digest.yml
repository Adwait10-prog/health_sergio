# Hourly Gmail digest. Vercel's Hobby plan only runs crons once a day, so GitHub pings the app
# instead, during waking hours only; the app decides whether anything is worth sending.
name: Gmail digest

on:
  schedule:
    - cron: "30 2-16 * * *" # hourly 08:00–22:00 IST (UTC+5:30); overnight mail is picked up at 08:00. GitHub may run a few minutes late.
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the app to sync and summarise
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://health-sergio.vercel.app/api/gmail/digest
